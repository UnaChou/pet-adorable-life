<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pet Adorable Life{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/analyze.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/organize.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/diary.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <a href="#main-content" class="skip-to-content">跳到主要內容</a>
    {% if session.get('user_id') %}
    <nav class="nav-bar">
        <a href="/" class="logo">Pet Adorable Life</a>
        <ul class="nav-links">
            <li><a href="/" {% if request.endpoint == 'index' %}class="active"{% endif %}>首頁</a></li>
            <li><a href="/product/analyze" {% if request.endpoint == 'product_analyze_page' %}class="active"{% endif %}>商品分析</a></li>
            <li><a href="/organize" {% if request.endpoint in ['organize', 'organize_edit'] %}class="active"{% endif %}>Pet Life</a></li>
            <li><a href="/diary" {% if request.endpoint == 'diary' %}class="active"{% endif %}>寵物日記</a></li>
            <li><a href="/pets" {% if request.endpoint == 'pets_page' %}class="active"{% endif %}>寵物</a></li>
            <li><a href="/logout">登出</a></li>
        </ul>
    </nav>
    {% endif %}
    <main id="main-content">
    {% block content %}{% endblock %}
    </main>
</body>
</html>
