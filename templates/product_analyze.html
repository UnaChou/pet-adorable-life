{% extends "base.html" %}

{% block title %}商品分析 - Pet Adorable Life{% endblock %}

{% block content %}
<div class="analyze-page">
    <section class="analyze-hero">
        <h1>商品分析</h1>
        <p>上傳寵物商品圖片，AI 會自動擷取標題與摘要</p>
    </section>

    <section class="analyze-upload">
        <div class="camera-header-actions">
            <button type="button" class="btn btn-accent btn-sm" id="btnCamera">📷 開啟相機</button>
        </div>
        <div class="upload-container">
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" hidden>
                <div class="upload-placeholder" id="uploadPlaceholder">
                    <span class="upload-icon">📷</span>
                    <p>點擊或拖曳圖片到此處</p>
                    <p class="upload-hint">支援 PNG、JPG、WebP、GIF</p>
                </div>
                <div class="upload-preview hidden" id="uploadPreview">
                    <img id="previewImg" src="" alt="預覽">
                    <video id="cameraVideo" autoplay playsinline class="hidden"></video>
                    <canvas id="cameraCanvas" class="hidden"></canvas>
                </div>
            </div>
            <div class="camera-controls">
                <button type="button" class="btn btn-secondary hidden" id="btnCancelCamera">✕
                    取消</button>
                <button type="button" class="btn btn-accent btn-lg hidden" id="btnCapture">📸 拍照</button>
            </div>
        </div>
        <button type="button" class="btn btn-primary" id="btnAnalyze" disabled>開始分析</button>
    </section>

    <section class="analyze-result hidden" id="resultSection">
        <h2>分析結果 <span class="edit-hint">（可編修後儲存）</span></h2>
        <div class="result-edit-form add-form" id="resultForm">
            <div class="result-card">
                <div class="form-group">
                    <label for="resultTitle">商品名稱</label>
                    <input type="text" id="resultTitle" class="result-title-input" placeholder="商品標題" maxlength="500">
                </div>
                <div class="form-group">
                    <label for="resultSummary">商品摘要</label>
                    <textarea id="resultSummary" class="result-summary-input" rows="6" placeholder="商品描述、特色要點..."></textarea>
                </div>
                <div class="form-group">
                    <label for="resultPetId">適用寵物</label>
                    <select id="resultPetId"><option value="">未指定</option></select>
                </div>
                <button type="button" class="btn btn-primary btn-save-product" id="btnSaveProduct">💾 儲存並加入Pet Life</button>
            </div>
        </div>
    </section>

    <section class="analyze-error hidden" id="errorSection">
        <p class="error-msg" id="errorMsg"></p>
    </section>

    <section class="analyze-debug hidden" id="debugSection">
        <h3>接收回傳的 data</h3>
        <pre class="debug-raw" id="debugRaw"></pre>
    </section>

    <div class="loading hidden" id="loading">
        <div class="spinner"></div>
        <p>AI 分析中...</p>
    </div>
</div>

<script>
    (function () {
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const btnCamera = document.getElementById('btnCamera');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const uploadPreview = document.getElementById('uploadPreview');
        const previewImg = document.getElementById('previewImg');
        const cameraVideo = document.getElementById('cameraVideo');
        const cameraCanvas = document.getElementById('cameraCanvas');
        const btnCapture = document.getElementById('btnCapture');
        const btnCancelCamera = document.getElementById('btnCancelCamera');
        const btnAnalyze = document.getElementById('btnAnalyze');
        const resultSection = document.getElementById('resultSection');
        const resultTitleInput = document.getElementById('resultTitle');
        const resultSummaryInput = document.getElementById('resultSummary');
        const errorSection = document.getElementById('errorSection');
        const errorMsg = document.getElementById('errorMsg');
        const loading = document.getElementById('loading');
        const debugSection = document.getElementById('debugSection');
        const debugRaw = document.getElementById('debugRaw');

        let selectedFile = null;
        let mediaStream = null;

        btnCamera.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                cameraVideo.srcObject = mediaStream;
                cameraVideo.classList.remove('hidden');
                previewImg.classList.add('hidden');
                uploadPlaceholder.classList.add('hidden');
                uploadPreview.classList.remove('hidden');
                btnCapture.classList.remove('hidden');
                btnCancelCamera.classList.remove('hidden');
                btnAnalyze.disabled = true;
            } catch (err) {
                console.error('Error accessing camera:', err);
                alert('無法開啟相機，請確保已授權相機權限');
            }
        });

        btnCapture.addEventListener('click', (e) => {
            e.stopPropagation();
            const context = cameraCanvas.getContext('2d');
            cameraCanvas.width = cameraVideo.videoWidth;
            cameraCanvas.height = cameraVideo.videoHeight;
            context.drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);

            cameraCanvas.toBlob((blob) => {
                selectedFile = new File([blob], 'camera_capture.jpg', { type: 'image/jpeg' });
                previewImg.src = URL.createObjectURL(blob);
                previewImg.classList.remove('hidden');
                cameraVideo.classList.add('hidden');
                btnCapture.classList.add('hidden');
                btnCancelCamera.classList.add('hidden');
                uploadPlaceholder.classList.add('hidden');
                uploadPreview.classList.remove('hidden');

                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }

                btnAnalyze.disabled = false;
                resultSection.classList.add('hidden');
                errorSection.classList.add('hidden');

                handleFile(selectedFile);
            }, 'image/jpeg', 0.9);
        });

        btnCancelCamera.addEventListener('click', (e) => {
            e.stopPropagation();
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            cameraVideo.classList.add('hidden');
            btnCapture.classList.add('hidden');
            btnCancelCamera.classList.add('hidden');
            if (selectedFile) {
                previewImg.classList.remove('hidden');
            } else {
                uploadPlaceholder.classList.remove('hidden');
                uploadPreview.classList.add('hidden');
            }
        });

        uploadZone.addEventListener('click', (e) => {
            if (e.target === btnCapture || e.target === btnCancelCamera) return;
            fileInput.click();
        });
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) handleFile(file);
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            selectedFile = file;
            previewImg.src = URL.createObjectURL(file);
            uploadPlaceholder.classList.add('hidden');
            uploadPreview.classList.remove('hidden');
            btnAnalyze.disabled = false;
            resultSection.classList.add('hidden');
            errorSection.classList.add('hidden');
        }

        btnAnalyze.addEventListener('click', async () => {
            if (!selectedFile) return;
            loading.classList.remove('hidden');
            resultSection.classList.add('hidden');
            errorSection.classList.add('hidden');
            debugSection.classList.add('hidden');

            const formData = new FormData();
            formData.append('image', selectedFile);

            let rawText = '';
            let success = false;
            let attempts = 0;
            const maxAttempts = 3;

            while (!success && attempts < maxAttempts) {
                attempts++;
                try {
                    const response = await fetch('/api/product/analyze', { method: 'POST', body: formData });
                    rawText = await response.text();
                    if (response.ok) {
                        success = true;
                    } else if (attempts < maxAttempts) {
                        console.log(`Attempt ${attempts} failed, retrying...`);
                    }
                } catch (err) {
                    if (attempts >= maxAttempts) {
                        debugRaw.textContent = '網路錯誤: ' + err.message;
                        debugSection.classList.remove('hidden');
                        errorMsg.textContent = err.message;
                        errorSection.classList.remove('hidden');
                        loading.classList.add('hidden');
                        return;
                    }
                    console.log(`Attempt ${attempts} network error, retrying...`);
                }
            }

            let data;
            try {
                data = JSON.parse(rawText);
            } catch (e) {
                debugRaw.textContent = 'JSON 解析失敗 (line 1 column 1)\n\n原始回傳:\n' + rawText;
                debugSection.classList.remove('hidden');
                errorMsg.textContent = '伺服器回傳非 JSON，請查看下方「接收回傳的 data」';
                errorSection.classList.remove('hidden');
                loading.classList.add('hidden');
                return;
            }

            // 永遠顯示接收到的完整 data
            debugRaw.textContent = JSON.stringify(data, null, 2);
            debugSection.classList.remove('hidden');

            if (!data || data.error) {
                errorMsg.textContent = data?.error || '分析失敗';
                errorSection.classList.remove('hidden');
            } else {
                resultTitleInput.value = data.title || '(無標題)';
                resultSummaryInput.value = data.summary || '';
                resultSection.classList.remove('hidden');
            }
            loading.classList.add('hidden');
        });

        // Load pets
        fetch('/api/pets').then(r => r.json()).then(data => {
            const sel = document.getElementById('resultPetId');
            (data.pets || []).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.name;
                sel.appendChild(opt);
            });
        });

        document.getElementById('btnSaveProduct').addEventListener('click', async () => {
            const title = document.getElementById('resultTitle').value.trim();
            const summary = document.getElementById('resultSummary').value.trim();
            const pet_id = document.getElementById('resultPetId').value;
            try {
                const res = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, summary, pet_id: pet_id ? parseInt(pet_id) : null }),
                });
                if (res.ok) {
                    window.location.href = '/organize';
                } else {
                    alert('儲存失敗，請重試');
                }
            } catch (e) {
                alert('操作失敗，請稍後再試');
            }
        });
    })();
</script>
{% endblock %}
