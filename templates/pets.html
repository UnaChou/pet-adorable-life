{% extends "base.html" %}

{% block title %}寵物管理 - Pet Adorable Life{% endblock %}

{% block content %}
<div class="pets-page">
    <section class="organize-hero">
        <h1>🐾 我的寵物</h1>
        <p>管理你的毛孩檔案</p>
    </section>

    <section class="pets-add-section">
        <button class="btn btn-secondary" id="btnToggleAdd">➕ 新增寵物</button>
        <div id="addFormWrap" class="hidden organize-add">
            <h2>新增寵物</h2>
            <form id="addPetForm" class="add-form">
                <div class="form-group">
                    <label for="addName">名字 *</label>
                    <input type="text" id="addName" placeholder="例如：小黑" maxlength="200" required>
                </div>
                <div class="form-group">
                    <label for="addBreed">品種 / 種類</label>
                    <input type="text" id="addBreed" placeholder="例如：柴犬" maxlength="200">
                </div>
                <div class="form-group">
                    <label for="addBirthday">生日</label>
                    <input type="date" id="addBirthday">
                </div>
                <div class="form-group">
                    <label for="addPhoto">照片</label>
                    <input type="file" id="addPhoto" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary">新增</button>
            </form>
        </div>
    </section>

    <section class="pets-list" id="petsList">
        <div class="loading" id="petsLoading"><div class="spinner"></div><p>載入中...</p></div>
    </section>
</div>

<!-- Share dialog -->
<div id="shareDialog" class="hidden modal-overlay">
    <div class="modal-content">
        <h2>👥 共同飼養管理</h2>
        <input type="hidden" id="sharePetId">

        <h3 style="font-size:.9rem;margin:.75rem 0 .25rem">共同飼養人</h3>
        <div id="sharesList"><div class="spinner"></div></div>

        <h3 style="font-size:.9rem;margin:1rem 0 .25rem">待確認邀請</h3>
        <div id="invitesList"><div class="spinner"></div></div>

        <h3 style="font-size:.9rem;margin:1rem 0 .25rem">新增共同飼養人</h3>
        <div class="form-group">
            <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
                <input type="text" id="shareUsername" placeholder="帳號名稱" maxlength="100" style="flex:1;min-width:120px">
                <select id="shareRole" style="flex:0 0 auto">
                    <option value="read_only">僅能檢視</option>
                    <option value="editor">可編輯</option>
                </select>
                <button type="button" class="btn btn-primary" id="btnSendInvite">發送邀請</button>
            </div>
            <p id="shareError" class="hidden" style="color:var(--danger,#e74c3c);margin:.25rem 0 0;font-size:.85rem"></p>
            <p id="shareSuccess" class="hidden" style="color:var(--success,#27ae60);margin:.25rem 0 0;font-size:.85rem"></p>
        </div>

        <div class="form-actions" style="margin-top:1rem">
            <button type="button" class="btn btn-secondary" id="btnCloseShare">關閉</button>
        </div>
    </div>
</div>

<!-- Edit dialog -->
<div id="editDialog" class="hidden modal-overlay">
    <div class="modal-content">
        <h2>✎ 編輯寵物</h2>
        <form id="editPetForm" class="add-form">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label for="editName">名字 *</label>
                <input type="text" id="editName" maxlength="200" required>
            </div>
            <div class="form-group">
                <label for="editBreed">品種 / 種類</label>
                <input type="text" id="editBreed" maxlength="200">
            </div>
            <div class="form-group">
                <label for="editBirthday">生日</label>
                <input type="date" id="editBirthday">
            </div>
            <div class="form-group">
                <label for="editPhoto">更換照片（留空則保留現有）</label>
                <input type="file" id="editPhoto" accept="image/*">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">儲存</button>
                <button type="button" class="btn btn-secondary" id="btnCloseEdit">取消</button>
            </div>
        </form>
    </div>
</div>

<script>
(function () {
    const petsList = document.getElementById('petsList');
    const petsLoading = document.getElementById('petsLoading');
    const addFormWrap = document.getElementById('addFormWrap');
    const btnToggleAdd = document.getElementById('btnToggleAdd');
    const addPetForm = document.getElementById('addPetForm');
    const editDialog = document.getElementById('editDialog');
    const editPetForm = document.getElementById('editPetForm');
    const btnCloseEdit = document.getElementById('btnCloseEdit');
    const shareDialog = document.getElementById('shareDialog');
    const btnCloseShare = document.getElementById('btnCloseShare');

    btnToggleAdd.addEventListener('click', () => {
        const open = !addFormWrap.classList.contains('hidden');
        addFormWrap.classList.toggle('hidden');
        btnToggleAdd.textContent = open ? '➕ 新增寵物' : '➖ 隱藏';
    });

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function calcAge(birthday) {
        if (!birthday) return '';
        const diff = Date.now() - new Date(birthday).getTime();
        const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
        return years > 0 ? `${years} 歲` : '未滿 1 歲';
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function loadPets() {
        petsLoading.classList.remove('hidden');
        try {
            const res = await fetch('/api/pets');
            if (!res.ok) throw new Error('載入失敗');
            const data = await res.json();
            renderPets(data.pets || []);
        } catch (e) {
            petsList.innerHTML = '<p>載入失敗，請重新整理</p>';
        } finally {
            petsLoading.classList.add('hidden');
        }
    }

    function renderPets(pets) {
        if (!pets.length) {
            petsList.innerHTML = '<div class="empty-state"><span class="empty-icon">🐾</span><p>尚無寵物，點擊「➕ 新增寵物」建立第一個寵物檔案</p></div>';
            return;
        }
        petsList.innerHTML = '<div class="pets-grid">' +
            pets.map(p => `
            <article class="pet-card" data-id="${escapeHtml(p.id)}">
                <div class="pet-card-actions">
                    ${p.is_shared
                        ? `<span class="pet-shared-badge" title="由他人共享">👥 共享</span>
                           ${p.role === 'editor' ? `<button class="btn-icon edit btn-edit-pet" data-id="${escapeHtml(p.id)}" title="編輯">✎</button>` : ''}`
                        : `<button class="btn-icon btn-share-pet" data-id="${escapeHtml(p.id)}" title="共同飼養管理">👥</button>
                           <button class="btn-icon edit btn-edit-pet" data-id="${escapeHtml(p.id)}" title="編輯">✎</button>
                           <button class="btn-icon remove btn-remove-pet" data-id="${escapeHtml(p.id)}" title="刪除">✕</button>`
                    }
                </div>
                <div class="pet-card-avatar">
                    ${p.photo_base64
                        ? `<img src="${escapeHtml(p.photo_base64)}" alt="${escapeHtml(p.name)}">`
                        : '🐾'}
                </div>
                <div class="pet-card-info">
                    <div class="pet-card-name">${escapeHtml(p.name)}</div>
                    ${p.breed ? `<div class="pet-card-meta">${escapeHtml(p.breed)}</div>` : ''}
                    ${p.birthday ? `<div class="pet-card-meta">${calcAge(p.birthday)}</div>` : ''}
                </div>
            </article>`).join('') +
        '</div>';

        petsList.querySelectorAll('.btn-share-pet').forEach(btn => {
            btn.addEventListener('click', () => openShare(parseInt(btn.dataset.id)));
        });
        petsList.querySelectorAll('.btn-edit-pet').forEach(btn => {
            btn.addEventListener('click', () => openEdit(pets.find(p => p.id == btn.dataset.id)));
        });
        petsList.querySelectorAll('.btn-remove-pet').forEach(btn => {
            btn.addEventListener('click', () => deletePet(parseInt(btn.dataset.id)));
        });
    }

    addPetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const photoFile = document.getElementById('addPhoto').files[0];
            const body = {
                name: document.getElementById('addName').value.trim(),
                breed: document.getElementById('addBreed').value.trim(),
                birthday: document.getElementById('addBirthday').value || null,
                photo_base64: photoFile ? await fileToBase64(photoFile) : '',
            };
            const res = await fetch('/api/pets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (res.ok) {
                addPetForm.reset();
                addFormWrap.classList.add('hidden');
                btnToggleAdd.textContent = '➕ 新增寵物';
                loadPets();
            } else {
                const err = await res.json();
                alert(err.error || '新增失敗');
            }
        } catch (e) {
            alert('操作失敗，請稍後再試');
        }
    });

    function openEdit(pet) {
        if (!pet) return;
        document.getElementById('editId').value = pet.id;
        document.getElementById('editName').value = pet.name;
        document.getElementById('editBreed').value = pet.breed || '';
        document.getElementById('editBirthday').value = pet.birthday || '';
        document.getElementById('editPhoto').value = '';
        editDialog.classList.remove('hidden');
    }

    btnCloseEdit.addEventListener('click', () => { editDialog.classList.add('hidden'); });
    editDialog.addEventListener('click', (e) => {
        if (e.target === editDialog) editDialog.classList.add('hidden');
    });

    editPetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const id = document.getElementById('editId').value;
            const photoFile = document.getElementById('editPhoto').files[0];
            const body = {
                name: document.getElementById('editName').value.trim(),
                breed: document.getElementById('editBreed').value.trim(),
                birthday: document.getElementById('editBirthday').value || null,
            };
            if (photoFile) body.photo_base64 = await fileToBase64(photoFile);
            const res = await fetch(`/api/pets/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (res.ok) {
                editDialog.classList.add('hidden');
                loadPets();
            } else {
                const err = await res.json();
                alert(err.error || '更新失敗');
            }
        } catch (e) {
            alert('操作失敗，請稍後再試');
        }
    });

    async function deletePet(id) {
        if (!confirm('確定要刪除此寵物嗎？相關日記和商品的寵物歸屬將被清除。')) return;
        try {
            const res = await fetch(`/api/pets/${id}`, { method: 'DELETE' });
            if (res.ok || res.status === 204) {
                loadPets();
            } else {
                alert('刪除失敗');
            }
        } catch (e) {
            alert('刪除失敗，請稍後再試');
        }
    }

    // ── Share dialog ──────────────────────────────────────────────────────────

    function openShare(petId) {
        document.getElementById('sharePetId').value = petId;
        document.getElementById('shareUsername').value = '';
        document.getElementById('shareError').classList.add('hidden');
        document.getElementById('shareSuccess').classList.add('hidden');
        shareDialog.classList.remove('hidden');
        loadShareData(petId);
    }

    async function loadShareData(petId) {
        document.getElementById('sharesList').innerHTML = '<div class="spinner"></div>';
        document.getElementById('invitesList').innerHTML = '<div class="spinner"></div>';
        try {
            const [sharesRes, invRes] = await Promise.all([
                fetch(`/api/pets/${petId}/shares`),
                fetch(`/api/pets/${petId}/invitations`),
            ]);
            const sharesData = sharesRes.ok ? await sharesRes.json() : { shares: [] };
            const invData = invRes.ok ? await invRes.json() : { invitations: [] };

            const roleLabel = { read_only: '僅能檢視', editor: '可編輯' };

            const sharesHtml = sharesData.shares.length
                ? sharesData.shares.map(s => `
                    <div style="display:flex;align-items:center;gap:.5rem;margin:.25rem 0">
                        <span style="flex:1">${escapeHtml(s.username)}</span>
                        <span class="badge">${escapeHtml(roleLabel[s.role] || s.role)}</span>
                        <button class="btn-icon remove" data-share-id="${s.id}" title="移除">✕</button>
                    </div>`).join('')
                : '<p style="color:var(--muted,#888);font-size:.85rem;margin:0">尚無共同飼養人</p>';
            document.getElementById('sharesList').innerHTML = sharesHtml;
            document.getElementById('sharesList').querySelectorAll('[data-share-id]').forEach(btn => {
                btn.addEventListener('click', () => removeShare(petId, parseInt(btn.dataset.shareId)));
            });

            const pending = invData.invitations.filter(i => i.status === 'pending');
            const invHtml = pending.length
                ? pending.map(i => `
                    <div style="display:flex;align-items:center;gap:.5rem;margin:.25rem 0">
                        <span style="flex:1">${escapeHtml(i.invitee_username)}</span>
                        <span class="badge">${escapeHtml(roleLabel[i.role] || i.role)}</span>
                        <button class="btn-icon remove" data-inv-id="${i.id}" title="取消邀請">✕</button>
                    </div>`).join('')
                : '<p style="color:var(--muted,#888);font-size:.85rem;margin:0">無待確認邀請</p>';
            document.getElementById('invitesList').innerHTML = invHtml;
            document.getElementById('invitesList').querySelectorAll('[data-inv-id]').forEach(btn => {
                btn.addEventListener('click', () => cancelInvitation(petId, parseInt(btn.dataset.invId)));
            });
        } catch (e) {
            document.getElementById('sharesList').innerHTML = '<p>載入失敗</p>';
        }
    }

    async function removeShare(petId, shareId) {
        if (!confirm('確定要移除此共同飼養人？')) return;
        const res = await fetch(`/api/pets/${petId}/shares/${shareId}`, { method: 'DELETE' });
        if (res.ok || res.status === 204) {
            loadShareData(petId);
        } else {
            alert('移除失敗');
        }
    }

    async function cancelInvitation(petId, invId) {
        if (!confirm('確定要取消此邀請？')) return;
        const res = await fetch(`/api/pets/${petId}/invitations/${invId}`, { method: 'DELETE' });
        if (res.ok || res.status === 204) {
            loadShareData(petId);
        } else {
            alert('取消失敗');
        }
    }

    document.getElementById('btnSendInvite').addEventListener('click', async () => {
        const petId = document.getElementById('sharePetId').value;
        const username = document.getElementById('shareUsername').value.trim();
        const role = document.getElementById('shareRole').value;
        const errEl = document.getElementById('shareError');
        const okEl = document.getElementById('shareSuccess');
        errEl.classList.add('hidden');
        okEl.classList.add('hidden');
        if (!username) { errEl.textContent = '請輸入帳號名稱'; errEl.classList.remove('hidden'); return; }
        try {
            const res = await fetch(`/api/pets/${petId}/invitations`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, role }),
            });
            const data = await res.json();
            if (res.ok) {
                okEl.textContent = `已發送邀請給 ${escapeHtml(data.invitee_username)}`;
                okEl.classList.remove('hidden');
                document.getElementById('shareUsername').value = '';
                loadShareData(parseInt(petId));
            } else {
                errEl.textContent = data.error || '發送失敗';
                errEl.classList.remove('hidden');
            }
        } catch (e) {
            errEl.textContent = '操作失敗，請稍後再試';
            errEl.classList.remove('hidden');
        }
    });

    btnCloseShare.addEventListener('click', () => { shareDialog.classList.add('hidden'); });
    shareDialog.addEventListener('click', (e) => {
        if (e.target === shareDialog) shareDialog.classList.add('hidden');
    });

    loadPets();
})();
</script>
{% endblock %}
